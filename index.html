<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トップ</title>
<script>
  // サーバに新しい版があれば読み込み直す
  (async () => {
    try {
      const res = await fetch(location.pathname, { cache: 'no-cache' });
      const latest = Date.parse(res.headers.get('last-modified'));
      const key = 'reloaded:' + location.pathname;
      if (latest > Date.parse(document.lastModified) && sessionStorage.getItem(key) != latest) {
        sessionStorage.setItem(key, latest);
        location.replace(location.pathname + '?v=' + Date.now() + location.hash);
      }
    } catch {}
  })();
</script>
</head>
<body>
<ul>
  <li><a href="calculator.html">計算機</a></li>
  <li><a href="othello.html">オセロ</a></li>
  <li><a href="gotanno.html">五反野乗り換え案内</a></li>
</ul>
<p><button id="clear">キャッシュをクリア</button></p>
<script>
  document.getElementById('clear').onclick = async () => {
    try { localStorage.clear(); sessionStorage.clear(); } catch {}
    try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
    try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch {}
    // ブラウザのHTTPキャッシュはJSから消せないので、URLを変えて読み込み直す
    location.href = location.pathname + '?v=' + Date.now();
  };
  // 各ページへのリンクも毎回新しく読み込むようにする
  for (const a of document.querySelectorAll('ul a')) a.href += '?v=' + Date.now();
</script>
</body>
</html>

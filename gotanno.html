<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五反野乗り換え案内</title>
<script>
  // サーバに新しい版があれば読み込み直す
  (async () => {
    try {
      const res = await fetch(location.pathname, { cache: 'no-cache' });
      const latest = Date.parse(res.headers.get('last-modified'));
      const key = 'reloaded:' + location.pathname;
      if (latest > Date.parse(document.lastModified) && sessionStorage.getItem(key) != latest) {
        sessionStorage.setItem(key, latest);
        location.replace(location.pathname + '?v=' + Date.now() + location.hash);
      }
    } catch {}
  })();
</script>
<style>
  :root { --bg: #0b0d17; --card: rgba(255,255,255,.04); --line: rgba(255,255,255,.1); --text: #e8eaf2; --muted: #8b90a7; --accent: linear-gradient(135deg, #7c5cff, #00d4ff); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; color: var(--text);
    background: radial-gradient(circle at 20% 0%, #2a1d6b 0, transparent 45%), radial-gradient(circle at 90% 100%, #00475e 0, transparent 40%), var(--bg);
    padding: 48px 16px; }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
  h1 { margin: 0; font-size: clamp(24px, 6vw, 34px); background: var(--accent); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header svg { width: 110px; flex-shrink: 0; opacity: .55; }
  .card { padding: 20px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(8px); }
  .form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  select, input, button { width: 100%; min-width: 0; font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); color-scheme: dark; }
  select:focus, input:focus { outline: none; border-color: #7c5cff; }
  #go { grid-column: 1 / -1; border: 0; background: var(--accent); font-weight: 700; cursor: pointer; transition: filter .2s, transform .2s; }
  #go:hover { filter: brightness(1.15); transform: translateY(-1px); }
  #result:not(:empty) { margin-top: 20px; }
  #result h2 { margin: 0 0 6px; font-size: 18px; }
  #result p { margin: 0 0 12px; color: #00d4ff; }
  ol { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid #7c5cff; }
  ol li { position: relative; padding: 6px 0; font-size: 14px; }
  ol li::before { content: ""; position: absolute; left: -24px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: #00d4ff; }
  .note { color: var(--muted); font-size: 12px; margin-top: 20px; }
  a.back { display: inline-block; margin-top: 20px; color: var(--muted); font-size: 13px; text-decoration: none; }
  a.back:hover { color: var(--text); }
</style>
</head>
<body>
<main>
<header>
  <h1>五反野乗り換え案内</h1>
  <svg viewBox="0 0 120 50" aria-hidden="true">
    <rect x="4" y="6" width="104" height="30" rx="10" fill="none" stroke="#00d4ff" stroke-width="2.5"/>
    <rect x="14" y="13" width="14" height="10" rx="2" fill="#00d4ff"/>
    <rect x="34" y="13" width="14" height="10" rx="2" fill="#00d4ff"/>
    <rect x="54" y="13" width="14" height="10" rx="2" fill="#00d4ff"/>
    <rect x="74" y="13" width="14" height="10" rx="2" fill="#00d4ff"/>
    <path d="M94 13h8a4 4 0 0 1 4 4v6H94z" fill="#7c5cff"/>
    <circle cx="26" cy="40" r="4" fill="#7c5cff"/><circle cx="86" cy="40" r="4" fill="#7c5cff"/>
    <line x1="0" y1="47" x2="120" y2="47" stroke="#8b90a7" stroke-width="2"/>
  </svg>
</header>
<div class="card">
  <div class="form">
    <select id="mode"><option value="from">五反野発</option><option value="to">五反野着</option></select>
    <select id="station"></select>
    <input type="time" id="time">
    <select id="timeMode"><option value="dep">に出発</option><option value="arr">までに到着</option></select>
    <button id="go">検索</button>
  </div>
  <div id="result"></div>
</div>
<p class="note">所要時間は1駅あたりの目安（スカイツリーライン・日比谷線2分、武蔵野線3分）と乗り換え時間から出した概算です。実際の時刻表とは違い、列車の待ち時間は含みません。</p>
<a class="back" href="index.html">← トップへ戻る</a>
</main>
<script>
  const lines = {
    sky: { name: '東武スカイツリーライン', min: 2, stations: ['浅草','とうきょうスカイツリー','曳舟','東向島','鐘ヶ淵','堀切','牛田','北千住','小菅','五反野','梅島','西新井','竹ノ塚','谷塚','草加','獨協大学前','新田','蒲生','新越谷','越谷','北越谷','大袋','せんげん台','武里','一ノ割','春日部','北春日部','姫宮','東武動物公園'] },
    hibiya: { name: '東京メトロ日比谷線', min: 2, stations: ['北千住','南千住','三ノ輪','入谷','上野','仲御徒町','秋葉原','小伝馬町','人形町','茅場町','八丁堀','築地','東銀座','銀座','日比谷','霞ケ関','虎ノ門ヒルズ','神谷町','六本木','広尾','恵比寿','中目黒'] },
    musashino: { name: 'JR武蔵野線', min: 3, stations: ['府中本町','北府中','西国分寺','新小平','新秋津','東所沢','新座','北朝霞','西浦和','武蔵浦和','南浦和','東浦和','東川口','南越谷','越谷レイクタウン','吉川','吉川美南','新三郷','三郷','南流山','新松戸','新八柱','東松戸','市川大野','船橋法典','西船橋'] },
  };

  // 五反野から見た行き方: [路線, 乗車駅, 降車駅] の並び。乗り換え時間つき
  function legsTo(dest) {
    if (lines.sky.stations.includes(dest)) return { legs: [['sky', '五反野', dest]], transfer: [] };
    if (lines.hibiya.stations.includes(dest)) return { legs: [['sky', '五反野', '北千住'], ['hibiya', '北千住', dest]], transfer: ['北千住で乗り換え（日比谷線直通の列車なら乗り換えなし）', 5] };
    return { legs: [['sky', '五反野', '新越谷'], ['musashino', '南越谷', dest]], transfer: ['新越谷駅と南越谷駅の間を徒歩で乗り換え', 7] };
  }

  const sel = document.getElementById('station');
  for (const k in lines) {
    const g = document.createElement('optgroup');
    g.label = lines[k].name;
    for (const s of lines[k].stations) {
      if (s === '五反野' || (k !== 'sky' && lines.sky.stations.includes(s))) continue;
      g.appendChild(new Option(s, s));
    }
    sel.appendChild(g);
  }

  const timeEl = document.getElementById('time');
  timeEl.value = new Date().toTimeString().slice(0, 5);
  const fmt = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

  document.getElementById('go').onclick = () => {
    const station = sel.value, toGotanno = document.getElementById('mode').value === 'to';
    let { legs, transfer } = legsTo(station);
    if (toGotanno) legs = legs.map(([l, a, b]) => [l, b, a]).reverse();
    // 乗車区間と乗り換えを所要分つきで並べる
    const steps = [];
    legs.forEach(([l, a, b], i) => {
      if (i > 0) steps.push({ transfer: transfer[0], t: transfer[1] });
      const st = lines[l].stations, n = Math.abs(st.indexOf(a) - st.indexOf(b));
      steps.push({ line: lines[l].name, a, b, n, t: n * lines[l].min });
    });
    const total = steps.reduce((sum, x) => sum + x.t, 0);
    const [h, m] = timeEl.value.split(':').map(Number);
    let cur = h * 60 + m;
    if (document.getElementById('timeMode').value === 'arr') cur -= total;
    const startTime = cur;
    let html = '<ol>';
    for (const x of steps) {
      const end = cur + x.t;
      html += x.transfer
        ? `<li>${fmt(cur)}〜${fmt(end)}　${x.transfer}（約${x.t}分）</li>`
        : `<li>${fmt(cur)} ${x.a} 発 → ${fmt(end)} ${x.b} 着　${x.line}（${x.n}駅・約${x.t}分）</li>`;
      cur = end;
    }
    html += '</ol>';
    document.getElementById('result').innerHTML =
      `<h2>${toGotanno ? station + ' → 五反野' : '五反野 → ' + station}</h2>` +
      `<p><b>${fmt(startTime)} 出発 → ${fmt(cur)} 到着</b>（約${total}分）</p>` + html;
  };
</script>
</body>
</html>
